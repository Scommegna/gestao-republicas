services:
  web:
    build: .
    ports:
      - "3000:80"
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-docker-local-secret-key-base-change-me}
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
    volumes:
      - rails_storage:/rails/storage

volumes:
  rails_storage:
